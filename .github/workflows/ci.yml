name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: xdebug
          coverage: xdebug

      - name: Install
        run: make install

      - name: Run linter
        run: make lint

      # make test-coverage падает, если покрытие ниже COVERAGE_MIN из Makefile
      - name: Run tests with coverage check
        run: make test-coverage
